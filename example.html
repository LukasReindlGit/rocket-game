<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fullscreen Result Screen</title>
  <style>
    :root {
      --bg-1: #040916;
      --bg-2: #08152b;
      --panel: rgba(8, 18, 40, 0.9);
      --line: rgba(100, 210, 255, 0.25);
      --glow: #86f7ff;
      --accent: #50e7ff;
      --text: #e6fbff;
      --muted: #8fb7c8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top center, rgba(43, 106, 223, 0.18), transparent 35%),
        radial-gradient(circle at bottom left, rgba(0, 183, 255, 0.08), transparent 30%),
        linear-gradient(180deg, var(--bg-2), var(--bg-1));
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: flex;
    }

    .screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      padding: 3vh 3vw;
      background: linear-gradient(180deg, rgba(8, 18, 40, 0.7), rgba(4, 10, 24, 0.88));
      overflow: hidden;
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 1.2vw;
      border: 1px solid rgba(134, 247, 255, 0.12);
      border-radius: 1.2vw;
      pointer-events: none;
    }

    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 80% 20%, rgba(80, 231, 255, 0.08), transparent 20%),
        radial-gradient(circle at 15% 80%, rgba(80, 231, 255, 0.05), transparent 25%);
      pointer-events: none;
    }

    .corners span {
      position: absolute;
      width: 2vw;
      height: 2vw;
      min-width: 18px;
      min-height: 18px;
      border-color: rgba(134, 247, 255, 0.45);
      border-style: solid;
      pointer-events: none;
    }

    .corners .tl {
      top: 1vw;
      left: 1vw;
      border-width: 2px 0 0 2px;
    }

    .corners .tr {
      top: 1vw;
      right: 1vw;
      border-width: 2px 2px 0 0;
    }

    .corners .bl {
      bottom: 1vw;
      left: 1vw;
      border-width: 0 0 2px 2px;
    }

    .corners .br {
      bottom: 1vw;
      right: 1vw;
      border-width: 0 2px 2px 0;
    }

    .layout {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      align-items: center;
    }

    .header {
      text-align: center;
      font-size: clamp(18px, 1.2vw, 28px);
      font-weight: 700;
      letter-spacing: 0.35em;
      color: rgba(230, 251, 255, 0.92);
      text-transform: uppercase;
      padding-top: 1vh;
    }

    .center {
      display: grid;
      grid-template-rows: auto auto auto 1fr;
      align-items: start;
      justify-items: center;
      text-align: center;
    }

    .time {
      margin: 0;
      font-size: clamp(120px, 13vw, 280px);
      line-height: 0.9;
      font-weight: 800;
      color: var(--glow);
      text-shadow:
        0 0 10px rgba(134, 247, 255, 0.45),
        0 0 30px rgba(80, 231, 255, 0.3),
        0 0 80px rgba(80, 231, 255, 0.12);
    }

    .time-label {
      margin-top: 1vh;
      font-size: clamp(18px, 1.4vw, 32px);
      font-weight: 700;
      letter-spacing: 0.25em;
      color: var(--accent);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 1vw;
    }

    .time-label::before,
    .time-label::after {
      content: "";
      width: 5vw;
      max-width: 90px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(80, 231, 255, 0.9), transparent);
    }

    .delta {
      margin-top: 2vh;
      font-size: clamp(42px, 4vw, 88px);
      font-weight: 800;
      color: #ffffff;
    }

    .sub {
      margin-top: 0.5vh;
      font-size: clamp(16px, 1.1vw, 28px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .bottom {
      width: 100%;
      display: grid;
      grid-template-columns: 18vw 1fr;
      gap: 3vw;
      align-items: center;
      padding: 0 8vw 5vh;
    }

    .qr-wrap {
      display: flex;
      justify-content: center;
    }

    .qr-box {
      width: 14vw;
      height: 14vw;
      min-width: 170px;
      min-height: 170px;
      max-width: 280px;
      max-height: 280px;
      padding: 0.8vw;
      border: 2px solid rgba(134, 247, 255, 0.6);
      border-radius: 0.6vw;
      background: rgba(5, 16, 36, 0.92);
      box-shadow:
        0 0 20px rgba(134, 247, 255, 0.18),
        inset 0 0 18px rgba(134, 247, 255, 0.08);
    }

    .qr {
      width: 100%;
      height: 100%;
      background:
        linear-gradient(90deg, #8ef9ff 10px, transparent 10px) 0 0 / 20px 20px,
        linear-gradient(#8ef9ff 10px, transparent 10px) 0 0 / 20px 20px,
        linear-gradient(90deg, transparent 10px, #8ef9ff 10px) 0 0 / 20px 20px,
        linear-gradient(transparent 10px, #8ef9ff 10px) 0 0 / 20px 20px,
        #09162e;
      position: relative;
      overflow: hidden;
    }

    .qr::before,
    .qr::after {
      content: "";
      position: absolute;
      width: 22%;
      height: 22%;
      border: 0.35vw solid #8ef9ff;
      background: #09162e;
    }

    .qr::before {
      top: 6%;
      left: 6%;
      box-shadow:
        220% 0 0 0 #09162e,
        220% 0 0 0.35vw #8ef9ff,
        0 220% 0 0 #09162e,
        0 220% 0 0.35vw #8ef9ff;
    }

    .copy {
      text-transform: uppercase;
    }

    .copy-top {
      font-size: clamp(20px, 1.6vw, 36px);
      letter-spacing: 0.15em;
      color: #e1faff;
      margin-bottom: 0.8vh;
    }

    .headline {
      margin: 0;
      font-size: clamp(48px, 4.4vw, 110px);
      line-height: 0.95;
      font-weight: 800;
      color: var(--accent);
      text-shadow:
        0 0 10px rgba(80, 231, 255, 0.3),
        0 0 30px rgba(80, 231, 255, 0.12);
    }

    .fine {
      margin-top: 1.2vh;
      font-size: clamp(18px, 1.3vw, 30px);
      color: var(--text);
      opacity: 0.9;
      text-transform: none;
    }

    .footer {
      text-align: center;
      padding-bottom: 1vh;
      font-size: clamp(16px, 1vw, 24px);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(134, 247, 255, 0.76);
    }

    @media (max-aspect-ratio: 4/3) {
      .bottom {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
        padding: 3vh 8vw 4vh;
      }

      .copy {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <main class="screen">
    <div class="corners">
      <span class="tl"></span>
      <span class="tr"></span>
      <span class="bl"></span>
      <span class="br"></span>
    </div>

    <div class="layout">
      <div class="header">RESULT</div>

      <section class="center">
        <h1 class="time">10.014</h1>
        <div class="time-label">Your Time</div>
        <div class="delta">+0.014 s</div>
        <div class="sub">From the target, 10.000 s</div>
      </section>

      <section class="bottom">
        <div class="qr-wrap">
          <div class="qr-box">
            <div class="qr" aria-label="QR code placeholder"></div>
          </div>
        </div>

        <div class="copy">
          <div class="copy-top">Join now and win</div>
          <h2 class="headline">AirPods Pro Max 2</h2>
          <div class="fine">Not the best time wins</div>
        </div>
      </section>

      <div class="footer">Thank you for playing!</div>
    </div>
  </main>
</body>
</html>
