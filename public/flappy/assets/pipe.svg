<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 400" width="90" height="400">
  <!-- Cap — flush with top edge of viewBox -->
  <rect x="0" y="0" width="90" height="36" rx="4" ry="4" fill="#22C55E"/>
  <!-- Cap top highlight -->
  <rect x="0" y="0" width="90" height="7" rx="4" ry="4" fill="#86EFAC" opacity="0.7"/>
  <!-- Cap left highlight stripe -->
  <rect x="6" y="0" width="14" height="36" rx="2" fill="#86EFAC" opacity="0.4"/>
  <!-- Cap right shadow -->
  <rect x="72" y="0" width="14" height="36" rx="2" fill="#15803D" opacity="0.45"/>
  <!-- Cap bottom edge shadow -->
  <rect x="0" y="30" width="90" height="6" fill="#15803D" opacity="0.3"/>

  <!-- Body — starts immediately below cap -->
  <rect x="4" y="36" width="82" height="364" fill="#4ADE80"/>
  <!-- Body left highlight -->
  <rect x="10" y="36" width="16" height="364" fill="#86EFAC" opacity="0.6"/>
  <!-- Body right shadow -->
  <rect x="72" y="36" width="10" height="364" fill="#16A34A" opacity="0.5"/>
</svg>
