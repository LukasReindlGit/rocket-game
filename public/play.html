<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>10 seconds — Play</title>
    <link rel="stylesheet" href="/css/play-screen.css" />
  </head>
  <body>
    <button type="button" class="play-hit" id="play-hit" aria-label="Start or stop timer"></button>
    <div class="play-ui">
      <main class="screen">
        <div class="corners" aria-hidden="true">
          <span class="tl"></span>
          <span class="tr"></span>
          <span class="bl"></span>
          <span class="br"></span>
        </div>

        <div class="layout">
          <div class="header" id="play-header">10 seconds</div>

          <section class="center is-playing" id="play-center" aria-live="polite">
            <h1 class="time" id="play-time">00.000</h1>
            <div class="time-label" id="play-time-label">Start &amp; stop</div>
            <div class="result-meta" id="play-result-meta" hidden>
              <div class="delta" id="play-result-delta" aria-hidden="true"></div>
              <div class="sub" id="play-result-sub">From the target (10.000 s)</div>
            </div>
            <p id="play-result-elapsed" class="sr-only" aria-live="polite"></p>
          </section>

          <section class="bottom bottom--solo" id="play-bottom">
            <div class="qr-wrap" id="play-qr-col" hidden>
              <div class="qr-box" id="play-qr-block" hidden>
                <div id="play-qr-host" class="qr-host"></div>
              </div>
            </div>

            <div class="copy">
              <div id="play-copy-playing" class="copy-variant">
                <div class="play-prize-block">
                  <div class="copy-top">Join now and win</div>
                  <h2 class="headline">AirPods Max 2</h2>
                  <div class="fine">Not the best time wins</div>
                </div>
                <!-- <div class="play-how-block">
                  <div class="play-how-label">How to play</div>
                  <p class="play-goal-line">
                    Stop the clock as close as possible to <strong class="play-goal-em">10.000&nbsp;s</strong>. Closest to the target wins.
                  </p>
                  <div class="fine play-how-tap">
                    Tap anywhere — or Space / Enter / K. Press once to start, again to stop.
                  </div>
                </div> -->
              </div>
              <div id="play-copy-result" class="copy-variant" hidden role="dialog" aria-modal="true" aria-labelledby="play-result-title">
                <p id="play-result-title" class="sr-only">Result</p>
                <div class="copy-top">Join now and win</div>
                <h2 class="headline">AirPods Max 2</h2>
                <div class="fine">Not the best time wins</div>

<!-- 
                <p class="play-survey-actions">
                  <a class="play-survey-link play-interactive" id="play-survey-link" href="#" hidden>Open registration form</a>
                </p>
                <details class="play-survey-details play-interactive" id="play-survey-details" hidden>
                  <summary>Show link</summary>
                  <p class="play-url-full" id="play-survey-url-full"></p>
                </details>
                <p class="play-error" id="play-survey-error" hidden></p>
                <div class="play-actions">
                  <button type="button" class="play-btn play-interactive" id="play-btn-again">Play again</button>
                </div> -->

              </div>
            </div>
          </section>

          <div class="footer">Thank you for playing!</div>
        </div>
      </main>
    </div>

    <script src="/js/play.js" defer></script>
  </body>
</html>
